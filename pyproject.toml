[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advplab"
version = "0.1.0"
description = "Executor headless de fontes AdvPL com fixtures JSON"
requires-python = ">=3.10"

[project.scripts]
advplab = "main:main"
advpl-testlab = "main:main"

[tool.setuptools]
py-modules = ["diagnostics", "executor", "fixture_runtime", "main", "semantic", "state_store"]
